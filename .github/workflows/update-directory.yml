name: Pull new asset map listings into Programs Directory

on:
  schedule:
    # Every Monday 13:00 UTC (9am ET). Change the cron or add workflow_dispatch
    # inputs if you want a different cadence.
    - cron: "0 13 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-directory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate new cards from the backend spreadsheet
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          NEW_LISTINGS_FILE: new_listings.txt
        run: python scripts/generate_new_cards.py

      - name: Read PR body
        id: body
        run: |
          if [ -f new_listings.txt ]; then
            {
              echo "body<<EOF"
              cat new_listings.txt
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "body=No new listings." >> "$GITHUB_OUTPUT"
          fi

      - name: Open a pull request with any new listings
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Add new asset map listings to Programs Directory"
          branch: auto/update-directory
          title: "New asset map listings ready for review"
          body: |
            Pulled from the [backend data map](https://docs.google.com/spreadsheets/d/1byn6F2Ktq-jdjUAV6RDp1LRMI73U5RxrNyY9v92jCcE/edit) spreadsheet.

            **New listings added as standardized cards — please review/polish the copy before merging, same as any manually added entry:**

            ${{ steps.body.outputs.body }}
          delete-branch: true
